name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name (empty = only list packages)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4.1.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: List workspace packages
        run: cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'
      - name: Run mutation testing
        if: ${{ inputs.package != '' }}
        env:
          PKG: ${{ inputs.package }}
        run: cargo mutants -p "$PKG" --timeout-multiplier 3
      - name: Upload results
        if: ${{ always() && inputs.package != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ inputs.package }}
          path: mutants.out
